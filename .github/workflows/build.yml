
name: Build MALDEE BEAUTY Website

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Upload finished website
        uses: actions/upload-artifact@v4
        with:
          name: maldee-beauty-dist
          path: dist/
          if-no-files-found: error
